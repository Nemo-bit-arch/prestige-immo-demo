  <style>
    :root {
      --accent: #0F172A;      /* remplacé au démarrage par CONFIG.accentColor */
      --wa: #25D366;          /* vert WhatsApp */
      --wa-ink: #053a1c;      /* encre lisible sur le vert (contraste > 7:1) */
      --wa-bord: #129a4c;
      --papier: #f8fafc;
      --sol: #f5f0e8;         /* fond sable clair : la ville au bord de l'estuaire */
      --surface: #ebe3d5;
      --ligne: #e2e8f0;
      --doux: #64748b;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--accent); background: var(--sol); }
    img { height: auto; }
    .ic { display: inline-block; width: 16px; height: 16px; flex: none; }
    .ic-sm { width: 14px; height: 14px; }

    /* Rangées horizontales sans barre visible (filtres, galerie) */
    .rail { display: flex; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .rail::-webkit-scrollbar { display: none; }
    /* Conteneur unique : mêmes bords à gauche et à droite sur toute la page */
    .wrap { width: min(1216px, calc(100% - 32px)); margin-inline: auto; }
    @media (min-width: 768px) { .wrap { width: min(1216px, calc(100% - 64px)); } }
    /* Sur ordinateur, l introduction occupe tout le premier écran sous l en-tête */
    @media (min-width: 1024px) { .accroche { min-height: calc(100svh - 72px); } }
    .rail.tire { scroll-snap-type: none !important; cursor: grabbing; }
    @media (min-width: 768px) { .tri-mobile { display: none; } }   /* tablette et ordinateur : le tri est sur la ligne des intercalaires */
    .rail:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }

    /* ───────────── Contrôles-objets : le monde de l'agence ───────────── */

    /* Sonnette (en-tête) : plaque d'interphone, bouton cerclé, deux vis */
    .sonnette { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 13px 0 9px;
      background: #fff; border: 1.5px solid var(--accent); border-radius: 10px; color: var(--accent);
      font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .sonnette::before, .sonnette::after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .4; }
    .sonnette::before { top: 4px; left: 4px; } .sonnette::after { bottom: 4px; right: 4px; }
    .sonnette__bouton { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; transition: box-shadow .2s; }
    .sonnette__bouton::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--wa); transition: transform .15s; }
    .sonnette.ouverte .sonnette__bouton { box-shadow: 0 0 0 4px rgba(37, 211, 102, .25); }
    .sonnette.ouverte .sonnette__bouton::before, .sonnette:active .sonnette__bouton::before { transform: scale(.65); }
    .sonnette:focus-visible { outline: 3px solid var(--wa-bord); outline-offset: 2px; }

    /* Intercalaires de classeur (Tous / Location / Vente) */
    /* Zone tactile de 44 px ; l'onglet inactif est dessiné plus bas (clip-path) et se lève quand on le touche */
    .intercalaires { display: flex; align-items: flex-end; gap: 2px; }
    .intercalaire { min-height: 44px; padding: 7px 20px 0; font-weight: 700; font-size: 14px; color: #5b6474; background: var(--surface);
      clip-path: polygon(10px 7px, calc(100% - 10px) 7px, 100% 100%, 0 100%);
      transition: clip-path .2s, padding .2s, background-color .2s, color .2s; -webkit-tap-highlight-color: transparent; }
    .intercalaire.ouverte:not([aria-pressed="true"]) { clip-path: polygon(10px 2px, calc(100% - 10px) 2px, 100% 100%, 0 100%); padding-top: 2px; color: var(--accent); }
    .intercalaire[aria-pressed="true"] { background: var(--accent); color: #fff; padding-top: 0; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 100%, 0 100%); }
    .intercalaire:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 4px; color: var(--accent); }
    .intercalaire[aria-pressed="true"]:focus-visible { color: #fff; }

    /* Plaques de rue émaillées (quartiers) : filet intérieur et deux vis */
    .plaque { position: relative; flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 17px;
      background: #fff; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 8px;
      box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px rgba(15, 23, 42, .28);
      font-weight: 600; font-size: 13.5px; white-space: nowrap; scroll-snap-align: start;
      transition: transform .2s, background-color .2s, color .2s; -webkit-tap-highlight-color: transparent; }
    .plaque::before, .plaque::after { content: ""; position: absolute; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: currentColor; opacity: .45; }
    .plaque::before { left: 6px; } .plaque::after { right: 6px; }
    .plaque.ouverte { transform: rotate(-1.5deg); }
    .plaque[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 4px rgba(255, 255, 255, .55); }
    .plaque:focus-visible { outline: 3px solid var(--wa-bord); outline-offset: 2px; }

    /* Étiquettes de prix (tri) : pointe, œillet, elles pivotent sur leur ficelle */
    .etiquette { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 15px 0 30px;
      background: var(--surface); color: var(--accent); font-weight: 600; font-size: 13px; white-space: nowrap;
      clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); transform-origin: 12px 50%;
      transition: transform .2s, background-color .2s, color .2s; -webkit-tap-highlight-color: transparent; }
    .etiquette::before { content: ""; position: absolute; left: 11px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--sol); box-shadow: inset 0 0 0 1.5px rgba(15, 23, 42, .35); }
    .etiquette.ouverte { transform: rotate(-4deg); }
    .etiquette[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .etiquette:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 3px; }

    /* Étiquette de clé (« Planifier une visite sur WhatsApp ») : anneau brisé, œillet, la clé tourne */
    .cle { position: relative; display: flex; align-items: center; width: 100%; min-height: 52px; padding-left: 8px;
      color: var(--wa-ink); text-decoration: none; -webkit-tap-highlight-color: transparent; }
    .cle__corps { position: relative; flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 16px 6px 46px;
      background: var(--wa); border-radius: 0 14px 14px 0; clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%);
      font-weight: 700; font-size: 14px; line-height: 1.25; transform-origin: 24px 50%;
      transition: transform .22s cubic-bezier(.3, .7, .3, 1.35); }
    .cle__corps::before { content: ""; position: absolute; left: 17px; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 50%;
      background: var(--fond-cle, #fff); box-shadow: inset 0 0 0 2.5px var(--wa-bord); }
    .cle__anneau { position: absolute; left: 15px; top: 50%; width: 30px; height: 30px; margin-top: -15px; z-index: 1; border-radius: 50%;
      border: 3px solid #64748b; border-top-color: transparent; transform: rotate(35deg); transition: transform .22s; pointer-events: none; }
    .cle__cle { width: 22px; height: 22px; flex: none; transition: transform .22s; }
    .cle.ouverte .cle__corps { transform: rotate(-3deg); }
    .cle.ouverte .cle__anneau { transform: rotate(10deg); }
    .cle.ouverte .cle__cle { transform: rotate(-90deg); }

    .cle:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 14px; }

    /* Dépliant (partage) : un prospectus plié en accordéon qui s'ouvre à plat */
    .depliant { display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 20px;
      color: var(--accent); font-weight: 700; font-size: 14px;
      background: linear-gradient(90deg, #eef2f7 0 33.33%, #e0e6ee 33.33% 66.66%, #eef2f7 66.66%);
      clip-path: polygon(0 5px, 33.33% 0, 66.66% 5px, 100% 0, 100% calc(100% - 5px), 66.66% 100%, 33.33% calc(100% - 5px), 0 100%);
      transition: clip-path .22s; -webkit-tap-highlight-color: transparent; }
    .depliant.ouverte { clip-path: polygon(0 0, 33.33% 0, 66.66% 0, 100% 0, 100% 100%, 66.66% 100%, 33.33% 100%, 0 100%); }
    .depliant:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* Porte (refermer la fiche) : au repos elle est entrouverte, elle se referme sous le doigt */
    .porte { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 12px;
      color: var(--accent); font-weight: 600; font-size: 13px; -webkit-tap-highlight-color: transparent; }
    .porte__cadre { position: relative; width: 20px; height: 26px; border: 2px solid currentColor; border-bottom: 0; border-radius: 4px 4px 0 0; perspective: 70px; }
    .porte__cadre::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0; height: 2px; background: currentColor; }
    .porte__battant { position: absolute; inset: 1px 1px 0 1px; background: currentColor; opacity: .85; border-radius: 2px 2px 0 0;
      transform-origin: left center; transform: rotateY(-62deg); transition: transform .22s; }
    .porte__battant::after { content: ""; position: absolute; right: 2px; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
    .porte.ouverte .porte__battant, .porte:active .porte__battant { transform: rotateY(0); }
    .porte:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Tableau à clés (réinitialiser) : trois clés suspendues qui se balancent */
    .tableau { display: inline-flex; flex-direction: column; align-items: center; gap: 7px; padding: 9px 22px 11px;
      background: #fff; border: 1.5px solid var(--accent); border-top-width: 4px; border-radius: 6px 6px 12px 12px;
      color: var(--accent); font-weight: 700; font-size: 14px; -webkit-tap-highlight-color: transparent; }
    .tableau__crochets { display: flex; gap: 14px; }
    .tableau__crochets i { display: block; width: 10px; height: 16px; transform-origin: 50% 0; transition: transform .22s;
      clip-path: polygon(50% 0, 100% 30%, 100% 100%, 0 100%, 0 30%); }
    .tableau__crochets i:nth-child(1) { background: var(--wa); }
    .tableau__crochets i:nth-child(2) { background: var(--accent); }
    .tableau__crochets i:nth-child(3) { background: #94a3b8; }
    .tableau.ouverte .tableau__crochets i:nth-child(odd) { transform: rotate(14deg); }
    .tableau.ouverte .tableau__crochets i:nth-child(2) { transform: rotate(-14deg); }
    .tableau:focus-visible { outline: 3px solid var(--wa-bord); outline-offset: 3px; }

    /* Panneau d'agence suspendu à deux chaînettes (« Parcourir les biens ») : il se balance sous le doigt */
    .panneau-zone { padding-top: 18px; }
    .panneau { position: relative; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 22px;
      background: var(--accent); color: #fff; border-radius: 6px; font-weight: 700; font-size: 15px; text-decoration: none;
      box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 4px rgba(255, 255, 255, .35);
      transform-origin: 50% -18px; transition: transform .25s cubic-bezier(.3, .7, .3, 1.4); -webkit-tap-highlight-color: transparent; }
    .panneau::before, .panneau::after { content: ""; position: absolute; top: -18px; width: 2px; height: 18px;
      background: repeating-linear-gradient(to bottom, #8b8478 0 3px, transparent 3px 5px); }
    .panneau::before { left: 24px; } .panneau::after { right: 24px; }
    .panneau.ouverte { transform: rotate(-2deg); }

    .panneau:focus-visible { outline: 3px solid var(--wa-bord); outline-offset: 4px; }

    /* Mosaïque du héros (ordinateur) : les trois premiers biens, en grand */
    .mosaique { grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; height: clamp(440px, 64vh, 620px); }
    .mosaique > :first-child { grid-row: span 2; }
    .mosaique[data-n="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .mosaique[data-n="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .mosaique[data-n="1"] > :first-child, .mosaique[data-n="2"] > :first-child { grid-row: auto; }
    .vitrine { position: relative; display: block; overflow: hidden; border-radius: 20px; background: var(--surface); -webkit-tap-highlight-color: transparent; }
    .vitrine img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }

    @media (prefers-reduced-motion: no-preference) {

    }
    @keyframes entree { from { opacity: 0; transform: translateY(14px); } }

    /* Lien d'évitement : caché hors écran, visible au premier Tab */
    .saut { position: absolute; left: 0; top: -80px; z-index: 60; padding: 10px 14px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; }
    .saut:focus { top: 12px; }

    /* Carte d'annonce : elle se soulève de 2 px, la photo s'approche */
    .carte { display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s; }
    @media (hover: hover) { .carte:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -22px rgba(15, 23, 42, .45); } }
    .carte__ouvrir { display: block; width: 100%; text-align: left; border-radius: 1.25rem; -webkit-tap-highlight-color: transparent; }
    .carte__ouvrir:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .carte__ouvrir img { transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
    @media (hover: hover) { .carte:hover .carte__ouvrir img { transform: scale(1.03); } }

    /* Barre de filtres : collée sous l'en-tête sur ordinateur */
    .filtres { background: var(--sol); }
    @media (min-width: 1024px) {
      .filtres { position: sticky; top: 72px; z-index: 20; background: color-mix(in srgb, var(--sol) 90%, transparent);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    }

    /* Badge « En ligne » */
    .en-ligne { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: #e9f9ef; color: #0d7a3c; font-size: 11px; font-weight: 700; }
    .en-ligne__point { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--wa); }

    @keyframes pouls { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }

    /* Bottom sheet */
    .fiche { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: transparent; overflow: hidden; }
    .fiche::backdrop { background: rgba(15, 23, 42, .5); }
    .fiche[open]::backdrop { animation: voile .3s ease-out; }
    @keyframes voile { from { opacity: 0; } }
    .fiche__feuille { position: absolute; left: 50%; bottom: 0; width: min(100%, 28rem); max-height: 94dvh; translate: -50% 0;
      display: flex; flex-direction: column; background: #fff; border-radius: 26px 26px 0 0; overflow: hidden;
      transition: transform .22s ease-in; }
    .fiche[open] .fiche__feuille { animation: monter .34s cubic-bezier(.2, .8, .2, 1); }
    @keyframes monter { from { transform: translateY(100%); } }
    .fiche__feuille.ferme { transform: translateY(100%); }
    .fiche__feuille.glisse { transition: none; }
    .fiche__corps { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .fiche__pied { --fond-cle: #fff; position: sticky; bottom: 0; z-index: 2; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ligne); background: #fff; }
    .galerie > * { flex: 0 0 100%; scroll-snap-align: start; }

    /* Tirages photo (vignettes de la fiche, ordinateur) : bord blanc de tirage, le tirage affiché est cerclé */
    .vignettes { display: none; }
    .vignette { flex: 0 0 auto; width: 104px; aspect-ratio: 4 / 3; padding: 3px; background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .18); opacity: .6; transition: opacity .2s, transform .2s, box-shadow .2s; }
    .vignette img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
    .vignette:hover { opacity: .9; transform: translateY(-2px); }
    .vignette[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2.5px var(--accent); }
    .vignette:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Fiche sur ordinateur : fenêtre centrée, photos à gauche, informations et clé à droite */
    @media (min-width: 1024px) {
      .fiche__feuille { top: 50%; bottom: auto; width: min(1120px, calc(100vw - 64px)); height: min(740px, calc(100dvh - 64px)); max-height: none;
        translate: -50% -50%; border-radius: 24px; transition: transform .2s ease-in, opacity .2s ease-in; }
      .fiche[open] .fiche__feuille { animation: apparaitre .3s cubic-bezier(.2, .8, .2, 1); }
      .fiche__feuille.ferme { transform: translateY(16px); opacity: 0; }
      #fiche-tete { position: absolute; top: 14px; right: 14px; height: auto; padding: 0; z-index: 3; background: rgba(255, 255, 255, .94); border-radius: 14px; }
      .poignee { display: none; }
      .fiche__corps { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); overflow: hidden; }
      .fiche__media { display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 18px 0 18px 18px; }
      .galerie-cadre { flex: 1; min-height: 0; padding: 0; }
      #galerie { height: 100%; }
      #galerie > div { aspect-ratio: auto; height: 100%; }
      .vignettes { display: flex; gap: 10px; padding: 2px; }
      .fiche__infos { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
      #fiche-contenu { flex: 1; padding: 76px 32px 24px; }
      .fiche__pied { padding: 16px 32px 20px; }
    }
    @keyframes apparaitre { from { opacity: 0; transform: translateY(20px) scale(.985); } }

    /* Squelettes */
    .squelette { background: var(--surface); border-radius: 12px; animation: respire 1.4s ease-in-out infinite; }
    @keyframes respire { 50% { opacity: .55; } }

    /* Toast */
    .toast { transition: opacity .2s, transform .2s; }
    .toast[hidden] { display: block; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; visibility: hidden; }

      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

</head>

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       1. CONFIGURATION (marque blanche) : à modifier pour chaque client
       ═══════════════════════════════════════════════════════════════════ */
    const CONFIG = {
      agencyName: "Prestige Immo Libreville",
      agencySubtitle: "Biens vérifiés • Réponse instantanée 24h/24",
      whatsappNumber: "24104585514",           // ligne 074 58 55 14 connectée à OpenWA (forme WhatsApp à 8 chiffres), sans « + » ni « @c.us »
      sheetCsvUrl: "",                          // Google Sheets publié en CSV ; vide ou en erreur → MOCK_DATA
      accentColor: "#0F172A",
      fallbackImage: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80",

    /* Données de démonstration : même structure que le Google Sheets.

        url_photo: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80"

        description_courte: "Au troisième étage d'une résidence gardée, un séjour traversant que la brise de l'estuaire rafraîchit en fin de journée. Cuisine équipée, trois chambres climatisées et une place de parking en sous-sol.",
        url_photo: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1616594039964-ae9021a400a0?auto=format&fit=crop&w=800&q=80"
      },
      {
        id_bien: "PIL-004", statut: "Dispo", transaction: "Vente", type_bien: "Villa duplex avec piscine", quartier: "Angondjé",
        prix_fcfa: "175000000", chambres: "4",
        description_courte: "Une maison familiale sur deux niveaux, pensée pour recevoir. La piscine prolonge la terrasse couverte, et chacune des quatre chambres dispose de sa salle d'eau. Titre foncier disponible.",

      },
      {
        id_bien: "PIL-005", statut: "Dispo", transaction: "Location", type_bien: "Appartement", quartier: "Louis",
        prix_fcfa: "450000", chambres: "2",
        description_courte: "À Louis, entre les restaurants et le front de mer, un appartement lumineux aux finitions soignées. Il conviendra à un couple ou à un jeune cadre qui souhaite tout faire à pied.",
        url_photo: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80, https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80"
      },
      {
        id_bien: "PIL-006", statut: "Loué", transaction: "Location", type_bien: "Studio", quartier: "Glass",
        prix_fcfa: "300000", chambres: "1",
        description_courte: "Ce bien est loué : il ne doit pas apparaître.",
        url_photo: "https://images.unsplash.com/photo-1554995207-c18c203602cb?auto=format&fit=crop&w=800&q=80"
      }
    ];

    /* ═══════════════════════════════════════════════════════════════════
       2. OUTILS
       ═══════════════════════════════════════════════════════════════════ */
    const $ = (sel, racine = document) => racine.querySelector(sel);
    const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /** Échappe une valeur venue du Sheet avant de l'insérer dans le HTML. */
    function escapeHtml(valeur) {
      return String(valeur ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    /** Minuscules sans accents, pour comparer « Meublée », « meublee », « MEUBLÉ ». */
    function normaliser(texte) {
      return String(texte ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
    }

    /**
     * Optimisation Cloudinary pour la 4G.
     * - URL vide → image de repli.
     * - URL Cloudinary sans f_webp → on injecte la chaîne d'optimisation juste après /upload/.
     * - Toute largeur w_XXX déjà présente dans les transformations est ramenée à `width`
     *   (sinon une transformation chaînée w_1080 réagrandirait l'image après la nôtre).
     * - Toute autre URL (Unsplash…) est rendue telle quelle.
     */
    function optimizeImage(url, width = 800) {
      const propre = String(url ?? "").trim();
      if (!propre) return CONFIG.fallbackImage;
      if (!propre.includes("res.cloudinary.com") || !propre.includes("/upload/")) return propre;

      const cesure = propre.indexOf("/upload/") + "/upload/".length;
      const tete = propre.slice(0, cesure);
      // Seuls les segments suivis d'un « , » ou d'un « / » sont des transformations : l'identifiant final n'est jamais touché.
      let suite = propre.slice(cesure).replace(/(^|[\/,])w_\d+(?=[,\/])/g, `$1w_${width}`);

      if (!suite.includes("f_webp")) {
        suite = `e_improve,e_sharpen:80,w_${width},c_limit,f_webp,q_auto:good/` + suite;
      }
      return tete + suite;
    }

    /** Attribut onerror commun à toutes les images : jamais d'image cassée. */
    const SUR_ERREUR = 'onerror="this.onerror=null;this.src=CONFIG.fallbackImage;"';

    /** 550000 → « 550 000 » (espace simple, lisible par l'automatisation n8n). */
    function milliers(n) {
      return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    /** Lit une ligne brute (Sheet ou démo) et la met en forme. */
    function preparerBien(brut) {
      const ligne = {};
      for (const [cle, valeur] of Object.entries(brut)) ligne[String(cle).trim().toLowerCase()] = typeof valeur === "string" ? valeur.trim() : valeur;

      const transactionNorm = normaliser(ligne.transaction);
      const transaction = transactionNorm === "location" ? "Location" : transactionNorm === "vente" ? "Vente" : (ligne.transaction || "");
      const prixNombre = Number(String(ligne.prix_fcfa ?? "").replace(/[^\d]/g, "")) || 0;

      // Suffixe : / nuit pour un meublé (meublé, meublée) ou une offre à la nuit, sinon / mois.
      let suffixe = "";
      if (transaction === "Location") {
        const type = normaliser(ligne.type_bien);
        suffixe = (type.includes("meuble") || type.includes("nuit")) ? "/ nuit" : "/ mois";
      }
      const prixBase = prixNombre ? `${milliers(prixNombre)} FCFA` : "Prix sur demande";
      const prixFormate = prixNombre && suffixe ? `${prixBase} ${suffixe}` : prixBase;

      const photos = String(ligne.url_photo ?? "").split(",").map(u => u.trim()).filter(u => /^https?:\/\//i.test(u));
      const chambres = parseInt(String(ligne.chambres ?? "").replace(/[^\d]/g, ""), 10);

      return {
        id_bien: String(ligne.id_bien ?? ""),
        statut: String(ligne.statut ?? ""),
        transaction,
        type_bien: String(ligne.type_bien ?? "Bien"),
        quartier: String(ligne.quartier ?? "Libreville"),
        prixNombre, prixBase, suffixe: prixNombre ? suffixe : "", prixFormate,
        chambres: Number.isFinite(chambres) ? chambres : null,
        description_courte: String(ligne.description_courte ?? ""),
        photos
      };
    }

    /** Filtre strict : seuls les biens au statut « dispo » sont affichés. */
    function estDisponible(bien) {
      return bien.id_bien && bien.statut.trim().toLowerCase() === "dispo";
    }

    /** Lien WhatsApp au format attendu par l'automatisation n8n + Geskap. Ne pas modifier le gabarit. */
    function lienWhatsApp(bien) {
      const message = `Bonjour, je suis intéressé par le bien [${bien.id_bien}] : ${bien.type_bien} à ${bien.quartier} (${bien.prixFormate}). Je souhaite organiser une visite.`;
      return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`;
    }

    /** Adresse partageable d'une fiche (?bien=PIL-001), sans le reste de la requête. */
    function urlBien(id) {
      const url = new URL(location.href);
      url.search = ""; url.hash = "";
      if (id) url.searchParams.set("bien", id);
      return url.toString();
    }

    function chambresTexte(n) {
      if (n === null) return "";
      if (n === 0) return "Studio";
      return `${n} chambre${n > 1 ? "s" : ""}`;
    }

    function rafraichirIcones() {
      if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 2 } });
    }

    let minuteurToast;
    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.hidden = false;
      clearTimeout(minuteurToast);
      minuteurToast = setTimeout(() => { el.hidden = true; }, 3200);
    }

    /* ═══════════════════════════════════════════════════════════════════
       3. CONTRÔLES-OBJETS ET RANGÉES À BALAYER
       ═══════════════════════════════════════════════════════════════════ */

    /** Pose .ouverte au survol souris, au focus clavier et sous le doigt (700 ms). */
    function lierObjets(racine = document) {
      for (const el of racine.querySelectorAll("[data-objet]:not([data-objet-lie])")) {
        el.setAttribute("data-objet-lie", "");
        const ouvrir = () => el.classList.add("ouverte"), fermer = () => el.classList.remove("ouverte");
        el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") ouvrir(); });
        el.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") fermer(); });
        el.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") ouvrir(); });
        el.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") setTimeout(fermer, 700); });
        el.addEventListener("pointercancel", fermer);
        el.addEventListener("focus", () => { if (el.matches(":focus-visible")) ouvrir(); });
        el.addEventListener("blur", fermer);
      }
    }

    /**
     * Rangée horizontale : le doigt la balaie nativement ; la souris l'attrape et la fait glisser
     * (le clic qui suit un glisser est neutralisé) ; les flèches du clavier avancent d'un élément.
     */
    function rangee(rail, quandIndex) {
      let prise = null;
      const largeurPas = () => (rail.firstElementChild ? rail.firstElementChild.getBoundingClientRect().width : rail.clientWidth);

      rail.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.button !== 0) return;
        prise = { x: e.clientX, depart: rail.scrollLeft, bouge: false };
      });
      window.addEventListener("pointermove", e => {
        if (!prise) return;
        const dx = e.clientX - prise.x;
        if (!prise.bouge && Math.abs(dx) > 6) { prise.bouge = true; rail.classList.add("tire"); }
        if (prise.bouge) rail.scrollLeft = prise.depart - dx;
      });
      window.addEventListener("pointerup", () => {
        if (!prise) return;
        const geste = prise; prise = null;
        if (!geste.bouge) return;
        const bloque = ev => { ev.preventDefault(); ev.stopPropagation(); };
        rail.addEventListener("click", bloque, true);
        setTimeout(() => rail.removeEventListener("click", bloque, true), 0);
        rail.classList.remove("tire");
      });
      rail.addEventListener("dragstart", e => e.preventDefault());

      rail.addEventListener("keydown", e => {
        if (e.target !== rail) return;
        const sens = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        if (!sens) return;
        e.preventDefault();
        rail.scrollBy({ left: sens * largeurPas(), behavior: reduit ? "auto" : "smooth" });
      });

      if (quandIndex) {
        let prevu = false;
        rail.addEventListener("scroll", () => {
          if (prevu) return;
          prevu = true;
          requestAnimationFrame(() => { prevu = false; quandIndex(Math.round(rail.scrollLeft / Math.max(1, rail.clientWidth))); });
        }, { passive: true });
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       4. ÉTAT, FILTRES ET RENDU
       ═══════════════════════════════════════════════════════════════════ */
    const etat = { biens: [], transaction: "Tous", quartier: "Tous", tri: null, demo: false };

    function biensVisibles() {
      let liste = etat.biens.filter(b =>
        (etat.transaction === "Tous" || b.transaction === etat.transaction) &&
        (etat.quartier === "Tous" || b.quartier === etat.quartier));
      if (etat.tri) {
        // Les biens « Prix sur demande » restent toujours en fin de liste.
        const valeur = b => b.prixNombre || (etat.tri === "asc" ? Infinity : -Infinity);
        liste = [...liste].sort((a, b) => etat.tri === "asc" ? valeur(a) - valeur(b) : valeur(b) - valeur(a));
      }
      return liste;
    }

    function rendreTransactions() {
      const boite = $("#filtre-transaction");
      boite.innerHTML = ["Tous", "Location", "Vente"].map(t =>
        `<button type="button" class="intercalaire" data-objet data-transaction="${t}" aria-pressed="${etat.transaction === t}">${t}</button>`).join("");
      lierObjets(boite);
    }

    function rendreQuartiers() {
      const quartiers = [...new Set(etat.biens.map(b => b.quartier))].sort((a, b) => a.localeCompare(b, "fr"));
      const boite = $("#filtre-quartier");
      boite.innerHTML = [["Tous", "Tous les quartiers"], ...quartiers.map(q => [q, q])].map(([valeur, libelle]) =>
        `<button type="button" class="plaque" data-objet data-quartier="${escapeHtml(valeur)}" aria-pressed="${etat.quartier === valeur}">${escapeHtml(libelle)}</button>`).join("");
      lierObjets(boite);
    }

    function majPressions() {
      document.querySelectorAll("[data-transaction]").forEach(b => b.setAttribute("aria-pressed", b.dataset.transaction === etat.transaction));
      document.querySelectorAll("[data-quartier]").forEach(b => b.setAttribute("aria-pressed", b.dataset.quartier === etat.quartier));
      document.querySelectorAll("[data-tri]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tri === etat.tri));
    }

    function carteHTML(bien) {
      const photo = optimizeImage(bien.photos[0], 600);
      const titre = `${bien.type_bien} à ${bien.quartier}`;
      const nbPhotos = bien.photos.length > 1
        ? `<span class="absolute top-3 right-3 inline-flex items-center gap-1 rounded-full bg-slate-900/60 text-white text-[11.5px] font-semibold px-2 py-1">
             <i data-lucide="images" class="ic ic-sm" aria-hidden="true"></i>${bien.photos.length}</span>` : "";
      const chambres = chambresTexte(bien.chambres);
      return `
        <article class="carte h-full bg-white rounded-3xl p-3 shadow-sm ring-1 ring-slate-900/5">
          <button type="button" class="carte__ouvrir" data-ouvrir="${escapeHtml(bien.id_bien)}" aria-label="Ouvrir la fiche : ${escapeHtml(titre)}, ${escapeHtml(bien.prixFormate)}">
            <span class="relative block aspect-[4/3] rounded-2xl overflow-hidden bg-slate-200">
              <img src="${escapeHtml(photo)}" alt="${escapeHtml(titre)}" loading="lazy" decoding="async" width="600" height="450"
                   class="absolute inset-0 w-full h-full object-cover" ${SUR_ERREUR}>
              <span class="absolute top-3 left-3 rounded-full bg-accent text-white text-[11px] font-bold uppercase tracking-wider px-2.5 py-1">${escapeHtml(bien.transaction)}</span>
              ${nbPhotos}
              <span class="absolute bottom-3 left-3 rounded-full bg-white/95 text-accent text-[14px] font-extrabold px-3 py-1.5 shadow-sm whitespace-nowrap">
                ${escapeHtml(bien.prixBase)}${bien.suffixe ? `<span class="font-semibold text-slate-500 text-[12.5px]"> ${escapeHtml(bien.suffixe)}</span>` : ""}
              </span>
            </span>
            <span class="block px-1 pt-3">
              <span class="block text-[17px] font-extrabold leading-snug tracking-tight">${escapeHtml(titre)}</span>
              <span class="mt-1.5 flex flex-wrap items-center gap-x-4 gap-y-1 text-[13px] font-medium text-slate-500">
                ${chambres ? `<span class="inline-flex items-center gap-1.5"><i data-lucide="bed-double" class="ic" aria-hidden="true"></i>${chambres}</span>` : ""}
                <span class="inline-flex items-center gap-1.5"><i data-lucide="map-pin" class="ic" aria-hidden="true"></i>${escapeHtml(bien.quartier)}, Libreville</span>
              </span>
              <span class="mt-2 block text-[13.5px] leading-relaxed text-slate-600 line-clamp-2">${escapeHtml(bien.description_courte)}</span>
            </span>
          </button>
          <div class="mt-auto pt-3">${cleHTML(bien)}</div>
        </article>`;
    }

    /** Introduction : chiffres tirés des biens disponibles, et mosaïque des trois premiers (ordinateur). */
    function rendreAccroche() {
      const biens = etat.biens;
      const n = biens.length;
      const location = biens.filter(b => b.transaction === "Location").length;
      const vente = biens.filter(b => b.transaction === "Vente").length;
      const quartiers = new Set(biens.map(b => b.quartier)).size;
      const pluriel = (v, mot) => `${mot}${v > 1 ? "s" : ""}`;
      $("#accroche-chiffres").innerHTML = [
        [n, `${pluriel(n, "bien")} ${pluriel(n, "disponible")}`],
        [location, "en location"],
        [vente, "à la vente"],
        [quartiers, pluriel(quartiers, "quartier")]
      ].filter(([v]) => v).map(([v, libelle]) => `
        <span class="block">
          <strong class="block text-[26px] lg:text-[34px] font-extrabold leading-none tracking-tight">${v}</strong>
          <span class="block mt-1 text-[12.5px] lg:text-[13px] font-semibold text-slate-500">${libelle}</span>
        </span>`).join("");
      $("#panneau-texte").textContent = n > 1 ? `Parcourir les ${n} biens` : "Parcourir les biens";

      const mosaique = $("#mosaique");
      const une = biens.slice(0, 3);
      mosaique.dataset.n = String(une.length);
      mosaique.innerHTML = une.map((b, i) => `
        <button type="button" class="vitrine" data-ouvrir="${escapeHtml(b.id_bien)}" aria-label="Ouvrir la fiche : ${escapeHtml(b.type_bien)} à ${escapeHtml(b.quartier)}, ${escapeHtml(b.prixFormate)}">
          <img src="${escapeHtml(optimizeImage(b.photos[0], i === 0 ? 1080 : 600))}" alt="${escapeHtml(b.type_bien)} à ${escapeHtml(b.quartier)}" loading="lazy" decoding="async" ${SUR_ERREUR}>
          <span class="absolute left-3 bottom-3 rounded-full bg-white/95 text-accent text-[13px] font-bold px-3 py-1.5 shadow-sm whitespace-nowrap">${escapeHtml(b.quartier)} · ${escapeHtml(b.prixFormate)}</span>
        </button>`).join("");
      if (!une.length) mosaique.classList.add("lg:hidden");
    }

    function cleHTML(bien) {
      return `
        <a class="cle" data-objet href="${escapeHtml(lienWhatsApp(bien))}" target="_blank" rel="noopener"
           aria-label="Planifier une visite sur WhatsApp : ${escapeHtml(bien.type_bien)} à ${escapeHtml(bien.quartier)}">
          <span class="cle__anneau" aria-hidden="true"></span>
          <span class="cle__corps">
            <svg class="cle__cle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="12" r="4"/><path d="M11 12h10M18 12v3.2M21 12v2.2"/></svg>
            <span>Planifier une visite sur WhatsApp</span>
          </span>
        </a>`;
    }

    function rendreFlux() {
      const flux = $("#flux");
      const liste = biensVisibles();
      const n = liste.length;
      $("#compteur").textContent = n
        ? `${n} bien${n > 1 ? "s" : ""} disponible${n > 1 ? "s" : ""}${etat.quartier !== "Tous" ? ` à ${etat.quartier}` : ""}`
        : "";

      if (!n) {
        flux.innerHTML = `
          <div class="md:col-span-2 xl:col-span-3 bg-white rounded-3xl px-6 py-10 text-center shadow-sm ring-1 ring-slate-900/5">
            <span class="mx-auto mb-4 grid place-items-center w-14 h-14 rounded-2xl bg-slate-100 text-slate-500">
              <i data-lucide="house" class="ic" style="width:26px;height:26px" aria-hidden="true"></i>
            </span>
            <p class="text-[17px] font-extrabold tracking-tight">Aucun bien ne répond à ces critères pour le moment.</p>
            <p class="mt-2 text-[14px] leading-relaxed text-slate-600">Élargissez votre recherche pour découvrir les autres adresses disponibles.</p>
            <button type="button" class="tableau mt-6" data-objet data-action="reinitialiser">
              <span class="tableau__crochets" aria-hidden="true"><i></i><i></i><i></i></span>Réinitialiser les filtres
            </button>
          </div>`;
      } else {
        flux.innerHTML = liste.map(carteHTML).join("");
      }
      flux.setAttribute("aria-busy", "false");
      const credit = $("#credit-photos");
      if (credit) credit.hidden = !etat.demo;
      lierObjets(flux);
      rafraichirIcones();
    }

    function appliquer(changement) {
      Object.assign(etat, changement);
      majPressions();
      rendreFlux();
    }

    /* ═══════════════════════════════════════════════════════════════════
       5. FICHE (BOTTOM SHEET), HISTORIQUE ET PARTAGE
       ═══════════════════════════════════════════════════════════════════ */
    const dialogue = $("#fiche"), feuille = $("#feuille");
    let bienOuvert = null, minuteurFermeture = null;

    function remplirFiche(bien) {
      const titre = `${bien.type_bien} à ${bien.quartier}`;
      const photos = bien.photos.length ? bien.photos : [""];
      const galerie = $("#galerie");
      galerie.innerHTML = photos.map((u, i) => `
        <div class="aspect-[4/3]">
          <img src="${escapeHtml(optimizeImage(u, 1080))}" alt="${escapeHtml(titre)}, photo ${i + 1} sur ${photos.length}"
               ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" width="1080" height="810"
               class="w-full h-full object-cover select-none" draggable="false" ${SUR_ERREUR}>
        </div>`).join("");
      galerie.scrollLeft = 0;

      // Tirages (ordinateur) : la même vignette 600 px que la carte, déjà en cache pour la première
      $("#vignettes").innerHTML = photos.length > 1 ? photos.map((u, i) => `
        <button type="button" class="vignette" data-photo="${i}" aria-label="Afficher la photo ${i + 1} sur ${photos.length}" aria-current="${i === 0}">
          <img src="${escapeHtml(optimizeImage(u, 600))}" alt="" loading="lazy" decoding="async" draggable="false" ${SUR_ERREUR}>
        </button>`).join("") : "";
      majCompteGalerie(0, photos.length);

      const chambres = chambresTexte(bien.chambres);
      $("#fiche-contenu").innerHTML = `
        <div class="flex items-center gap-2">
          <span class="rounded-full bg-accent text-white text-[11px] font-bold uppercase tracking-wider px-2.5 py-1">${escapeHtml(bien.transaction)}</span>
          <span class="text-[12px] font-semibold text-slate-500">Réf. ${escapeHtml(bien.id_bien)}</span>
        </div>
        <h2 id="fiche-titre" class="mt-3 text-[24px] lg:text-[30px] font-extrabold leading-tight tracking-tight">${escapeHtml(titre)}</h2>
        <p class="mt-1.5 text-[21px] lg:text-[24px] font-extrabold text-accent">${escapeHtml(bien.prixBase)}${bien.suffixe ? `<span class="text-[15px] font-semibold text-slate-500"> ${escapeHtml(bien.suffixe)}</span>` : ""}</p>
        <div class="mt-4 flex flex-wrap gap-2 text-[13px] font-semibold text-slate-600">
          ${chambres ? `<span class="inline-flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2"><i data-lucide="bed-double" class="ic" aria-hidden="true"></i>${chambres}</span>` : ""}
          <span class="inline-flex items-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2"><i data-lucide="map-pin" class="ic" aria-hidden="true"></i>${escapeHtml(bien.quartier)}, Libreville</span>
        </div>
        <h3 class="mt-6 text-[12px] font-bold uppercase tracking-wider text-slate-500">En quelques mots</h3>
        <p class="mt-2 text-[15px] leading-relaxed text-slate-700">${escapeHtml(bien.description_courte)}</p>
        <div class="mt-6">
          <button type="button" class="depliant" data-objet data-action="partager">
            <i data-lucide="share-2" class="ic" aria-hidden="true"></i>Transmettre cette fiche
          </button>
          <p class="mt-2 text-[12px] text-slate-500">Envoyez-la à un proche avant de convenir d'une visite.</p>
        </div>`;

      const cle = $("#fiche-cle");
      cle.href = lienWhatsApp(bien);
      cle.setAttribute("aria-label", `Planifier une visite sur WhatsApp : ${titre}`);
      $("#fiche-aide").textContent = `Votre message mentionne déjà la référence ${bien.id_bien} : il ne vous reste qu'à l'envoyer.`;

      lierObjets(dialogue);
      rafraichirIcones();
    }

    function majCompteGalerie(index, total) {
      const compte = $("#galerie-compte");
      compte.hidden = total < 2;
      compte.textContent = `${Math.min(index + 1, total)} / ${total}`;
      document.querySelectorAll("#vignettes .vignette").forEach((v, i) => v.setAttribute("aria-current", String(i === index)));
    }

    function allerPhoto(index) {
      const galerie = $("#galerie");
      galerie.scrollTo({ left: index * galerie.clientWidth, behavior: reduit ? "auto" : "smooth" });
      majCompteGalerie(index, galerie.children.length);   // le tirage choisi s'allume tout de suite, sans attendre la fin du défilement
    }

    function ouvrirFiche(id, { pousser = true } = {}) {
      const bien = etat.biens.find(b => b.id_bien === id);
      if (!bien) return false;
      clearTimeout(minuteurFermeture);
      bienOuvert = bien;
      remplirFiche(bien);
      feuille.classList.remove("ferme");
      feuille.style.transform = "";
      if (!dialogue.open) dialogue.showModal();
      document.documentElement.style.overflow = "hidden";
      if (pousser) history.pushState({ bien: id }, "", urlBien(id));
      document.title = `${bien.type_bien} à ${bien.quartier} · ${CONFIG.agencyName}`;
      return true;
    }

    /** Fermeture demandée par le visiteur : on passe par l'historique pour que « retour » reste cohérent. */
    function demanderFermeture() {
      if (!dialogue.open) return;
      if (history.state && history.state.bien) history.back();   // popstate → animerFermeture()
      else { history.replaceState(null, "", urlBien(null)); animerFermeture(); }
    }

    function animerFermeture() {
      if (!dialogue.open) return;
      feuille.style.transform = "";
      feuille.classList.add("ferme");
      clearTimeout(minuteurFermeture);
      minuteurFermeture = setTimeout(() => {
        dialogue.close();
        feuille.classList.remove("ferme");
        document.documentElement.style.overflow = "";
        document.title = `${CONFIG.agencyName} · Biens disponibles`;
        bienOuvert = null;
      }, reduit ? 0 : 220);
    }

    window.addEventListener("popstate", e => {
      const id = e.state && e.state.bien;
      if (id) ouvrirFiche(id, { pousser: false });
      else animerFermeture();
    });

    async function copier(texte) {
      try { await navigator.clipboard.writeText(texte); return true; } catch (_) { /* repli ci-dessous */ }
      try {
        const zone = Object.assign(document.createElement("textarea"), { value: texte });
        zone.setAttribute("readonly", ""); zone.style.cssText = "position:fixed;opacity:0";
        dialogue.appendChild(zone); zone.select();
        const ok = document.execCommand("copy");
        zone.remove();
        return ok;
      } catch (_) { return false; }
    }

    async function partager(bien) {
      const url = urlBien(bien.id_bien);
      const donnees = {
        title: `${bien.type_bien} à ${bien.quartier}`,
        text: `${bien.type_bien} à ${bien.quartier}, ${bien.prixFormate}. Une fiche de ${CONFIG.agencyName} :`,
        url
      };
      if (navigator.share) {
        try { await navigator.share(donnees); return; }
        catch (err) { if (err && err.name === "AbortError") return; }
      }
      toast(await copier(url)
        ? "Le lien de la fiche est copié. Il vous suffit de le coller dans votre conversation."
        : `Copiez ce lien : ${url}`);
    }

    /* Glisser la feuille vers le bas pour la refermer (depuis la poignée) */
    function lierGlisserFeuille() {
      const tete = $("#fiche-tete");
      let depart = null, dy = 0;
      tete.addEventListener("pointerdown", e => {
        if (e.target.closest("button") || window.matchMedia("(min-width: 1024px)").matches) return;
        depart = e.clientY; dy = 0;
        feuille.classList.add("glisse");
        tete.setPointerCapture(e.pointerId);
      });
      tete.addEventListener("pointermove", e => {
        if (depart === null) return;
        dy = Math.max(0, e.clientY - depart);
        feuille.style.transform = `translateY(${dy}px)`;
      });
      const relacher = () => {
        if (depart === null) return;
        depart = null;
        feuille.classList.remove("glisse");
        if (dy > 90) demanderFermeture();
        else feuille.style.transform = "";
      };
      tete.addEventListener("pointerup", relacher);
      tete.addEventListener("pointercancel", relacher);
    }

    /* ═══════════════════════════════════════════════════════════════════
       6. CHARGEMENT DES DONNÉES
       ═══════════════════════════════════════════════════════════════════ */
    function lireCsv(url) {
      return new Promise((resolve, reject) => {
        if (!window.Papa) return reject(new Error("PapaParse indisponible"));
        const minuteur = setTimeout(() => reject(new Error("Délai dépassé")), CONFIG.csvTimeoutMs);
        window.Papa.parse(url, {
          download: true, header: true, skipEmptyLines: "greedy",
          transformHeader: h => h.trim().toLowerCase(),
          complete: res => {
            clearTimeout(minuteur);
            const champs = (res.meta && res.meta.fields) || [];
            if (!res.data || !res.data.length || !champs.includes("id_bien") || !champs.includes("statut")) reject(new Error("CSV vide ou colonnes manquantes"));
            else resolve(res.data);
          },
          error: err => { clearTimeout(minuteur); reject(err); }
        });
      });
    }

    async function chargerBiens() {
      if (!String(CONFIG.sheetCsvUrl || "").trim()) { etat.demo = true; return MOCK_DATA; }
      try {
        return await lireCsv(CONFIG.sheetCsvUrl.trim());
      } catch (err) {
        console.warn("[Vitrine] Google Sheets indisponible, données de démonstration affichées :", err && err.message);
        etat.demo = true;
        return MOCK_DATA;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       7. DÉMARRAGE
       ═══════════════════════════════════════════════════════════════════ */
    function appliquerMarque() {
      document.documentElement.style.setProperty("--accent", CONFIG.accentColor);
      $("#agence-nom").textContent = CONFIG.agencyName;
      $("#agence-sous-titre").textContent = CONFIG.agencySubtitle;
      $("#accroche-titre").textContent = CONFIG.heroTitle;
      $("#accroche-texte").textContent = CONFIG.heroText;
      $("#pied-agence").textContent = `${CONFIG.agencyName} · Libreville, Gabon`;
      $("#sonnette").href = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(CONFIG.contactMessage)}`;
      document.title = `${CONFIG.agencyName} · Biens disponibles`;
    }

    function lierEvenements() {
      document.addEventListener("click", e => {
        const t = e.target.closest("[data-transaction],[data-quartier],[data-tri],[data-action],[data-ouvrir],[data-photo]");
        if (!t) return;
        if (t.dataset.transaction) appliquer({ transaction: t.dataset.transaction });
        else if (t.dataset.quartier) appliquer({ quartier: t.dataset.quartier });
        else if (t.dataset.tri) appliquer({ tri: etat.tri === t.dataset.tri ? null : t.dataset.tri });
        else if (t.dataset.action === "reinitialiser") appliquer({ transaction: "Tous", quartier: "Tous", tri: null });
        else if (t.dataset.action === "partager" && bienOuvert) partager(bienOuvert);
        else if (t.dataset.ouvrir) ouvrirFiche(t.dataset.ouvrir);
        else if (t.dataset.photo) allerPhoto(Number(t.dataset.photo));
      });

      $("#fiche-fermer").addEventListener("click", demanderFermeture);
      dialogue.addEventListener("cancel", e => { e.preventDefault(); demanderFermeture(); });   // Échap
      dialogue.addEventListener("click", e => { if (e.target === dialogue) demanderFermeture(); }); // voile
      lierGlisserFeuille();

      const galerie = $("#galerie");
      rangee(galerie, i => majCompteGalerie(i, galerie.children.length));
      rangee($("#filtre-quartier"));

      const lucideJs = document.getElementById("lucide-js");
      if (lucideJs) lucideJs.addEventListener("load", rafraichirIcones);
      window.addEventListener("load", rafraichirIcones);
    }

    async function demarrer() {
      appliquerMarque();
      lierEvenements();
      lierObjets();
      rendreTransactions();

      const brut = await chargerBiens();
      etat.biens = brut.map(preparerBien).filter(estDisponible);
      rendreQuartiers();
      rendreAccroche();
      rendreFlux();

      // Lien partagé (?bien=PIL-001) : la liste reste derrière, « retour » referme la fiche.
      const idPartage = new URLSearchParams(location.search).get("bien");
      if (idPartage && etat.biens.some(b => b.id_bien === idPartage)) {
        history.replaceState(null, "", urlBien(null));
        ouvrirFiche(idPartage);
      } else if (idPartage) {
        history.replaceState(null, "", urlBien(null));
      }
    }

    // PapaParse est différé : on attend DOMContentLoaded seulement si un Sheet est configuré.
    if (String(CONFIG.sheetCsvUrl || "").trim() && document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", demarrer);
    } else {
      demarrer();
    }
  </script>
</body>
</html>
